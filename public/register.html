<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d3a">
  <title>WaterMI - Create Account</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f4d3a'/%3E%3Cpath d='M6 18C5 10 10 6 19 6c0 9-5 14-13 12zm0 0 8-8' fill='none' stroke='%23b5e26b' stroke-width='1.8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card card">
      <div class="login-brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C4 10 10 4 20 4c0 10-6 16-15 15z"/><path d="M5 19l9-9"/></svg>
        <h1>WaterMI</h1>
      </div>
      <p class="login-subtitle">Create your account</p>

      <div id="register-error" class="login-error" hidden role="alert"></div>

      <!-- Email/Password Registration -->
      <form method="post" id="register-form">
        <div class="field">
          <label for="register-name">Name (optional)</label>
          <input type="text" id="register-name" name="name" autocomplete="name" placeholder="Your name" inputmode="text" maxlength="80">
        </div>

        <div class="field">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" required autocomplete="email" placeholder="you@example.com" inputmode="email">
        </div>

        <div class="field">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" required autocomplete="new-password" placeholder="At least 6 characters" minlength="6">
        </div>

        <div class="field">
          <label for="register-confirm">Confirm Password</label>
          <input type="password" id="register-confirm" name="confirm" required autocomplete="new-password" placeholder="Confirm your password">
        </div>

        <button type="submit" class="btn primary big" id="register-submit">Create Account</button>
      </form>

      <p class="login-hint">
        Already have an account? <a href="/" id="login-link">Sign in</a>
      </p>
    </div>
  </main>

  <div id="toast" role="status"></div>

  <script type="module" src="/register.js"></script>
</body>
</html>
