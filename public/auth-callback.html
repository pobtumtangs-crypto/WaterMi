<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d3a">
  <title>WaterMI - Completing Sign In</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f4d3a'/%3E%3Cpath d='M6 18C5 10 10 6 19 6c0 9-5 14-13 12zm0 0 8-8' fill='none' stroke='%23b5e26b' stroke-width='1.8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card card">
      <div class="login-brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C4 10 10 4 20 4c0 10-6 16-15 15z"/><path d="M5 19l9-9"/></svg>
        <h1>WaterMI</h1>
      </div>
      <p class="login-subtitle">Completing sign in...</p>

      <div class="loading">
        <div class="spinner" aria-hidden="true"></div>
        <p>Please wait while we sign you in.</p>
      </div>

      <div id="auth-error" class="login-error" hidden role="alert"></div>
      <p class="login-hint"><a href="/">Return to sign in</a></p>
    </div>
  </main>

  <script type="module" src="/auth-callback.js"></script>
</body>
</html>
