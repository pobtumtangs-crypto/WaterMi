<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d3a">
  <title>WaterMI - Sign In</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f4d3a'/%3E%3Cpath d='M6 18C5 10 10 6 19 6c0 9-5 14-13 12zm0 0 8-8' fill='none' stroke='%23b5e26b' stroke-width='1.8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card card">
      <div class="login-brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C4 10 10 4 20 4c0 10-6 16-15 15z"/><path d="M5 19l9-9"/></svg>
        <h1>WaterMI</h1>
      </div>
      <p class="login-subtitle">Sign in to track your plants</p>

      <div id="login-error" class="login-error" hidden role="alert"></div>

      <!-- Email/Password Sign In -->
      <form method="post" id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="you@example.com" inputmode="email" maxlength="254">
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter your password" maxlength="128">
        </div>

        <button type="submit" class="btn primary big" id="login-submit">Sign in with Email</button>
      </form>

      <p class="login-hint">
        Don't have an account? <a href="/register" id="register-link">Create one</a>
      </p>
    </div>
  </main>

  <script type="module" src="/login.js"></script>
</body>
</html>
